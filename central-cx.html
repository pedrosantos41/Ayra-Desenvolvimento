<meta name="claude:viewport-fit-sides" content="cover">
<title>Central CX Ayra</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
/* Marca Ayra: fundo branco, detalhes em vermelho e preto, fonte Cabin, faixa diagonal da capa dos manuais no topo.
   Layout: barra fixa com abas no topo; cada aba é uma coluna de seções; clientes aparecem como pastas agrupadas por coordenadoria. */
:root {
  color-scheme: light;
  --bg: #ffffff; --surface: #ffffff; --sunk: #f3f3f3;
  --ink: #1b1c1c; --muted: #5d5f60; --line: #dcdcdc;
  --accent: #b5202a; --accent-ink: #ffffff; --accent-soft: #f8e6e7;
  --black: #2b2c2c;
  --good: #1c7548; --good-soft: #dcefe4; --bad: #8c1820; --bad-soft: #f8e6e7;
  --warn: #7a5200; --warn-soft: #f6ecd4;
  --display: "Cabin", "Segoe UI", system-ui, sans-serif;
  --body: "Cabin", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Cabin", system-ui, sans-serif;
}

/* Tema escuro: escolhido pelo botão do cabeçalho (atributo data-tema), nunca automático. */
:root[data-tema="escuro"] {
  color-scheme: dark;
  --bg: #131414; --surface: #1c1d1d; --sunk: #262727;
  --ink: #f2f2f2; --muted: #a6a8a9; --line: #3a3c3c;
  --accent: #e5565e; --accent-ink: #190506; --accent-soft: #3d1a1d;
  --black: #4a4c4d;
  --good: #6fd09b; --good-soft: #17382a; --bad: #f29a93; --bad-soft: #43201d;
  --warn: #e6b65c; --warn-soft: #3d3016;
}
:root[data-tema="escuro"] .brand img { filter: invert(1); mix-blend-mode: screen }
:root[data-tema="escuro"] .faixa::before { background: #000 }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5 }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
.wrap { max-width: 1080px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2 }
h1 { font-size: 1.75rem; font-weight: 700 } h2 { font-size: 1.15rem; font-weight: 700 } h3 { font-size: 1.02rem; font-weight: 600 }
p { margin: 0 } a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 2px solid var(--black) }
.topin { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding-block: 10px 0 }
.faixa { position: relative; height: 46px; background: var(--surface); overflow: hidden }
.faixa::before, .faixa::after { content: ""; position: absolute; inset: 0 }
.faixa::before { background: var(--black); clip-path: polygon(0 0, 42% 0, 42% 30%, 0 100%) }
.faixa::after { background: var(--accent); clip-path: polygon(0 0, 100% 0, 100% 100%) }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 1.05rem; padding-bottom: 8px; letter-spacing: .02em; text-transform: uppercase }
.brand img { height: 38px; width: auto; display: block }
.brand span { color: var(--accent) }
nav { display: flex; gap: 2px; overflow-x: auto; min-width: 0; flex: 1 }
nav a { padding: 8px 12px 10px; text-decoration: none; color: var(--muted); font-weight: 600; white-space: nowrap; border-bottom: 2px solid transparent }
nav a:hover { color: var(--ink) }
nav a.on { color: var(--ink); border-bottom-color: var(--accent) }
/* No computador a gaveta não existe: os itens ficam soltos na barra de cima. No celular ela vira o menu lateral. */
.gaveta, .acoes { display: contents }
.acoes .btn { margin-bottom: 8px }
.hamb, .gtopo, .fundo { display: none }
.hamb { align-items: center; justify-content: center; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--ink); cursor: pointer }
@media (max-width: 720px) {
  .topin { flex-wrap: nowrap; gap: 8px; padding-block: 6px }
  .topin > .hamb { display: flex; margin-left: -10px }
  .brand { padding-bottom: 0 }
  .gaveta { display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; width: min(82vw, 300px); background: var(--surface); border-right: 2px solid var(--black); z-index: 2; overflow-y: auto; overscroll-behavior: contain;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 0 calc(env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-102%); visibility: hidden }
  .gtopo { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 8px 20px; border-bottom: 1px solid var(--line); font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .04em }
  .gtopo .hamb { display: flex }
  nav { flex-direction: column; flex: none; gap: 0; overflow: visible; padding-block: 8px }
  nav a { padding: 14px 20px; font-size: 1.08rem; border-bottom: 0; border-left: 4px solid transparent }
  nav a.on { border-left-color: var(--accent); background: var(--sunk) }
  .acoes { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding: 16px 20px 0; border-top: 1px solid var(--line) }
  .acoes .btn.mini { margin: 0; padding: 12px; font-size: .95rem }
  .fundo { position: fixed; inset: 0; z-index: 1; background: rgba(0, 0, 0, .5) }
  body.menu { overflow: hidden }
  body.menu .top { z-index: 40 }
  body.menu .gaveta { transform: none; visibility: visible }
  body.menu .fundo { display: block }
}

main, #chatview { padding-block: 24px 56px; display: flex; flex-direction: column; gap: 28px }
#aviso { margin-top: 16px }
#aviso div { background: var(--warn-soft); color: var(--warn); padding: 10px 14px; border-radius: 6px }
.sec { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.sub { color: var(--muted); font-size: .9rem }
.label { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0 }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)) }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 8px }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); flex-wrap: wrap; min-width: 0 }
.row:first-child { border-top: 0 }
.row .grow { flex: 1; min-width: 160px; overflow-wrap: anywhere }
.empty { border: 1px dashed var(--line); border-radius: 8px; padding: 18px; color: var(--muted) }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums }

.btn { font: inherit; font-weight: 600; font-size: .88rem; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer }
.btn:hover { border-color: var(--accent); color: var(--accent) }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.btn.pri:hover { color: var(--accent-ink); filter: brightness(1.08) }
.btn.mini { padding: 2px 8px; font-size: .8rem }
.btn.danger { color: var(--bad) }
.linkbtn { font: inherit; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; text-align: left; font-weight: 600 }
.linkbtn:hover { color: var(--accent) }
body.ro [data-w] { display: none }

.pill { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); white-space: nowrap }
.pill.ac { background: var(--black); color: #fff }
.pill.bom { background: var(--good-soft); color: var(--good) }
.pill.ruim { background: var(--bad-soft); color: var(--bad) }
.pill.av { background: var(--warn-soft); color: var(--warn) }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.kpi { border-left: 3px solid var(--accent) }
.kpi b { display: block; font-family: var(--display); font-size: 1.8rem; font-weight: 700; line-height: 1.1 }
.folder { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink); border-top: 3px solid var(--accent) }
.folder:hover { border-color: var(--accent) }
.folder .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; max-width: 65ch }

.tw { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px }
table { border-collapse: collapse; width: 100%; font-size: .92rem }
th, td { text-align: left; padding: 9px 14px; border-top: 1px solid var(--line); white-space: nowrap }
thead th { border-top: 0; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
td.r, th.r { text-align: right }

/* Gráficos: uma série só, na cor de destaque da marca; valores e rótulos sempre na cor do texto. */
.chart { display: flex; flex-direction: column; gap: 12px }
.bars { display: grid; grid-template-columns: minmax(84px, 36%) 1fr auto; gap: 8px 10px; align-items: center; font-size: .9rem }
.bars > span:first-child, .bars .rot { overflow-wrap: anywhere; line-height: 1.25 }
.bars .trk { position: relative; height: 14px }
.bars .bar { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px }
.bars .bar.neg { border-radius: 4px 0 0 4px }
.bars .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--muted) }
.lnc svg { width: 100%; height: auto; display: block }
.lnc text { fill: var(--muted); font-size: 11px; font-family: var(--body) }
.lnc .g { stroke: var(--line); stroke-width: 1 }
.lnc .p { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linejoin: round; stroke-linecap: round }
.lnc .d { fill: var(--accent); stroke: var(--surface); stroke-width: 2 }
.lnc .h { fill: transparent }
.lnc .h:hover + .d { stroke: var(--ink) }
details.dados { font-size: .86rem; color: var(--muted) }
details.dados summary { cursor: pointer }
details.dados div { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; border-top: 1px solid var(--line); max-width: 320px }
.ind { display: flex; flex-direction: column; gap: 10px }
.ba { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap }
.ba div b { display: block; font-family: var(--mono); font-size: 1.25rem; font-weight: 500; font-variant-numeric: tabular-nums }
.spark { color: var(--accent); margin-left: auto }
.sub i, p.sub { font-style: normal }
.meds { font-size: .86rem; border-top: 1px solid var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 4px }
.meds div { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }

.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start }
.col { background: var(--sunk); border-top: 3px solid var(--black); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; overflow-wrap: anywhere }
.task .meta, .ins .meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: .82rem; color: var(--muted) }
.ins { display: flex; flex-direction: column; gap: 8px }
.ins p, .doc { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 70ch }
@media (max-width: 720px) { .board { grid-template-columns: 1fr } }

select, input, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 100%; min-width: 0 }
textarea { min-height: 110px; resize: vertical }
.filter { width: auto }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); width: min(560px, calc(100% - 32px)); padding: 20px; max-height: 90vh }
dialog::backdrop { background: rgba(8, 20, 22, .55) }
#frm { display: flex; flex-direction: column; gap: 12px }
#frm label { display: flex; flex-direction: column; gap: 4px; font-size: .86rem; font-weight: 500 }
#frm small { color: var(--muted); font-weight: 400 }
#ferr { color: var(--bad); font-size: .88rem }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px }
.actions .sp { flex: 1 }

#msgs { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; height: min(58vh, 520px); overflow-y: auto; display: flex; flex-direction: column; gap: 10px }
.msg { max-width: 70ch; overflow-wrap: anywhere }
.msg .who { font-size: .78rem; color: var(--muted) }
.msg.me .who { color: var(--accent) }
#chatform { display: flex; gap: 8px }
@media (prefers-reduced-motion: no-preference) { .btn, nav a { transition: color .12s, border-color .12s }
  @media (max-width: 720px) { .gaveta { transition: transform .22s ease, visibility 0s .22s } body.menu .gaveta { transition: transform .22s ease } } }
</style>

const put = (col, id, data) => db.doc(col + '/' + id).set(data);
const del = (col, id) => db.doc(col + '/' + id).delete();
function aviso(t) { const a = $('#aviso'); a.hidden = !t; a.innerHTML = t ? `<div>${esc(t)}</div>` : ''; }

function analise(ind) {
  const ms = (ind.medicoes || []).map((m, i) => ({ ...m, i })).sort((a, b) => String(a.data).localeCompare(String(b.data)));
  const base = (ind.tipo === 'nps' ? (ms.find(m => m.fase === 'final') || ms.find(m => m.fase !== 'pos')) : ms.find(m => m.fase === 'antes')) || null;
  const pos = [...ms].reverse().find(m => m.fase === 'pos') || null;
  const ult = ms[ms.length - 1] || null;
  const ref = pos || (ult && ult !== base ? ult : null);
  let delta = null, pct = null, tom = '';
  if (base && ref) {
    delta = ref.valor - base.valor;
    if (ind.tipo === 'resultado' && ind.unidade !== '%' && base.valor !== 0) pct = delta / Math.abs(base.valor) * 100;
    tom = delta === 0 ? '' : ((ind.sentido === 'descer' ? delta < 0 : delta > 0) ? 'bom' : 'ruim');
  }
  return { ms, base, pos, ult, ref, delta, pct, tom };
}
function deltaTxt(ind, a) {
  if (a.delta == null) return '';
  const u = ind.unidade === '%' ? 'p.p.' : ind.unidade;
  let t = (a.delta > 0 ? '+' : '') + nf.format(a.delta) + (u ? ' ' + u : '');
  if (a.pct != null) t += ' (' + (a.pct > 0 ? '+' : '') + nf.format(Math.round(a.pct * 10) / 10) + '%)';
  return t;
}
function spark(ms) {
  if (ms.length < 2) return '';
  const vs = ms.map(m => m.valor), mn = Math.min(...vs), mx = Math.max(...vs), W = 120, H = 34, p = 4;
  const x = i => p + i * (W - 2 * p) / (vs.length - 1), y = v => mx === mn ? H / 2 : H - p - (v - mn) * (H - 2 * p) / (mx - mn);
  const pts = vs.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução das medições"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${x(vs.length - 1).toFixed(1)}" cy="${y(vs[vs.length - 1]).toFixed(1)}" r="3" fill="currentColor"/></svg>`;
}

/* ---------- gráficos ---------- */
const media = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
const r1 = v => Math.round(v * 10) / 10;
/* Barras horizontais a partir do zero. items: [{ r: rótulo, v: valor, sub: detalhe }]; `teto` fixa o fim da escala (100 em NPS e CSAT). */
function barras(items, un, teto) {
  const vs = items.map(i => i.v), lo = Math.min(0, ...vs), hi = Math.max(teto || 0, 0, ...vs), span = (hi - lo) || 1, z = (0 - lo) / span * 100;
  return `<div class="bars">` + items.map(i => {
    const w = Math.abs(i.v) / span * 100, l = i.v < 0 ? z - w : z;
    return `<span class="rot">${esc(i.r)}${i.sub ? ` <span class="sub">${esc(i.sub)}</span>` : ''}</span><span class="trk" title="${esc(i.r + ': ' + fv(i.v, un))}"><i class="zero" style="left:${z}%"></i><i class="bar ${i.v < 0 ? 'neg' : ''}" style="left:${l}%;width:${w}%"></i></span><b class="num">${esc(fv(i.v, un))}</b>`;
  }).join('') + `</div>`;
}
/* Linha para evolução no tempo: uma série, pontos com dica ao passar o mouse e a lista dos dados logo abaixo. */
function linha(items, un) {
  const W = 600, H = 220, L = 46, R = 16, T = 14, B = 30, vs = items.map(i => i.v), mn = Math.min(...vs), mx = Math.max(...vs);
  const lo = mn === mx ? mn - 1 : mn - (mx - mn) * .1, hi = mn === mx ? mx + 1 : mx + (mx - mn) * .1, n = items.length;
  const x = i => n === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (n - 1), y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const ticks = mn === mx ? [mn] : [mn, (mn + mx) / 2, mx], passo = Math.ceil(n / 6);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de linha com ${n} pontos">`;
  ticks.forEach(t => { s += `<line class="g" x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text x="${L - 8}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${esc(nf.format(r1(t)))}</text>`; });
  if (n > 1) s += `<polyline class="p" points="${items.map((d, i) => x(i).toFixed(1) + ',' + y(d.v).toFixed(1)).join(' ')}"/>`;
  items.forEach((d, i) => {
    const tip = `<title>${esc(d.r + ': ' + fv(d.v, un))}</title>`;
    s += `<circle class="h" cx="${x(i).toFixed(1)}" cy="${y(d.v).toFixed(1)}" r="13">${tip}</circle><circle class="d" cx="${x(i).toFixed(1)}" cy="${y(d.v).toFixed(1)}" r="4.5" pointer-events="none"/>`;
    if (i % passo === 0 || i === n - 1) {
      if (i === n - 1 && i % passo !== 0 && (n - 1) % passo < passo / 2 && n > 2) return;
      const r = d.r.length > 12 ? d.r.slice(0, 11) + '…' : d.r;
      s += `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${n > 1 && i === 0 ? 'start' : n > 1 && i === n - 1 ? 'end' : 'middle'}">${esc(r)}</text>`;
    }
  });
  return `<div class="lnc">${s}</svg></div><details class="dados"><summary>Ver dados</summary>${items.map(d => `<div><span>${esc(d.r)}</span><b class="num">${esc(fv(d.v, un))}</b></div>`).join('')}</details>`;
}
/* Painel automático de satisfação: usa a medição mais recente de cada NPS e CSAT cadastrado nas pastas dos clientes. */
function satisfacao() {
  const com = tipo => S.indicadores.filter(i => i.tipo === tipo).map(i => [i, analise(i)]).filter(([, a]) => a.ult);
  const nps = com('nps'), csat = com('csat');
  if (!nps.length && !csat.length) return `<div class="empty">Os gráficos aparecem aqui quando houver medições de NPS ou CSAT registradas nas pastas dos clientes.</div>`;
  const m = xs => xs.length ? nf.format(r1(media(xs))) : '—';
  const antes = nps.map(([, a]) => a.base?.valor).filter(v => v != null), pos = nps.map(([, a]) => a.pos?.valor).filter(v => v != null);
  const npsItems = nps.map(([i, a]) => ({ r: cliNome(i.clienteId) || 'Sem cliente', v: a.ult.valor, sub: FASE_TXT[a.ult.fase] || '' })).sort((a, b) => b.v - a.v);
  const g = {};
  csat.forEach(([i, a]) => (g[i.macroetapa || 'Sem macroetapa'] ||= []).push(a.ult.valor));
  const csatItems = Object.keys(g).sort((a, b) => a.localeCompare(b, 'pt-BR')).map(r => ({ r, v: r1(media(g[r])), sub: g[r].length + (g[r].length === 1 ? ' projeto' : ' projetos') }));
  return `<div class="kpis">
    <div class="card kpi"><span class="label">NPS médio no final do projeto (1 a 10)</span><b>${m(antes)}</b></div>
    <div class="card kpi"><span class="label">NPS médio no pós-venda (1 a 10)</span><b>${m(pos)}</b></div>
    <div class="card kpi"><span class="label">CSAT médio (1 a 5)</span><b>${csat.length ? m(csat.map(([, a]) => a.ult.valor)) : '—'}</b></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))">
    <div class="card chart"><div><h3>NPS por cliente</h3><span class="sub">Medição mais recente de cada cliente, em nota de 1 a 10.</span></div>${npsItems.length ? barras(npsItems, '', 10) : '<span class="sub">Nenhum NPS medido ainda.</span>'}</div>
    <div class="card chart"><div><h3>CSAT por macroetapa</h3><span class="sub">Média, em nota de 1 a 5, entre os projetos que já avaliaram cada macroetapa.</span></div>${csatItems.length ? barras(csatItems, '', 5) : '<span class="sub">Nenhum CSAT medido ainda.</span>'}</div></div>`;
}
/* Número digitado ou vindo da planilha no padrão brasileiro: "1.234,5", "42%", "R$ 300" e também "7.5". */
function numero(t) {
  t = String(t ?? '').replace(/[^\d.,-]/g, '');
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  return parseFloat(t);
}
/* Gráficos ligados ao Google Sheets: os dados não ficam guardados na central, são lidos da planilha com o conector
   Google Sheets de quem está vendo. PL guarda o estado de cada leitura; as leituras rodam em fila, uma por vez. */
const SHEETS = 'Google Sheets', PL = {};
let mcpPronto = false, filaPl = Promise.resolve();
const plId = url => (String(url || '').match(/\/d\/([\w-]{20,})/) || String(url || '').match(/^([\w-]{20,})$/) || [])[1] || '';
const plChave = g => g.id + '|' + g.planilhaUrl + '|' + g.intervalo;
const ERRO_PL = {
  server_not_connected: 'Adicione o conector Google Sheets em claude.ai, em Configurações → Conectores, para ver este gráfico.',
  selection_required: 'Você tem mais de um conector Google Sheets. Escolha qual usar no aviso do claude.ai e atualize.',
  needs_reauth: 'O acesso ao Google Sheets expirou. Reconecte o conector em claude.ai, em Configurações → Conectores.',
  not_in_manifest: 'O uso do Google Sheets não foi permitido para esta página. Permita no menu de permissões da página e atualize.',
  approval_required: 'A leitura da planilha precisa da sua aprovação. Clique em “Atualizar” e permita o acesso.',

  not_granted: 'O uso do Google Sheets não foi permitido para esta página.',
  blocked_by_policy: 'A sua organização bloqueia o uso do Google Sheets nesta página.',
  tool_error: 'A planilha não pôde ser lida. Confira o link, o nome da aba e o intervalo, e se a sua conta Google tem acesso a ela.',
  server_unavailable: 'O Google Sheets não respondeu agora. Tente atualizar em instantes.',
  gviz: 'A planilha não pôde ser lida. Confira o link, o nome da aba e o intervalo, e se ela está compartilhada como “Qualquer pessoa com o link”.',
};
function achaValores(p) {
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch { return null; } }
  if (Array.isArray(p)) return p.every(Array.isArray) ? p : null;
  if (!p || typeof p !== 'object') return null;
  if (Array.isArray(p.values)) return p.values;
  for (const k of Object.keys(p)) { const r = achaValores(p[k]); if (r) return r; }
  return null;
}
function lerPlanilha(g, forcar) {
  const k = plChave(g), id = plId(g.planilhaUrl);
  if (!id || !g.intervalo) { PL[k] = { erro: 'Informe o link da planilha e o intervalo em “Editar”.' }; return; }
  PL[k] = { ...(PL[k] || {}), lendo: true, erro: '' };
  const umaVez = () => mcp.callTool(SHEETS, 'get_values', { spreadsheetId: id, range: g.intervalo }, forcar ? { cache: { refresh: true } } : undefined);
  filaPl = filaPl.then(async () => {
    try {
      let r;
      try { r = await umaVez(); }
      catch (e) { if (!e?.retryable) throw e; await new Promise(ok => setTimeout(ok, Math.min(e.retryAfterMs || 1500, 8000) + Math.random() * 500)); r = await umaVez(); }
      const linhas = achaValores(r.payload) || [];
      const dados = linhas.map(l => ({ r: String(l[0] ?? '').trim(), v: typeof l[1] === 'number' ? l[1] : numero(l[1]) })).filter(d => d.r && isFinite(d.v)).slice(0, 40);
      PL[k] = dados.length ? { dados, em: r.cache?.storedAt || Date.now() } : { erro: 'O intervalo não trouxe dados. Ele precisa ter duas colunas: rótulos na primeira e números na segunda.' };
    } catch (e) {
      PL[k] = { erro: ERRO_PL[e?.code] || 'Não foi possível ler a planilha agora. Tente atualizar em instantes.' };
    }
    render();
  });
}
function grafCard(g) {
  const pl = g.fonte === 'planilha', det = [cliNome(g.clienteId), g.unidade ? 'em ' + g.unidade : ''].filter(Boolean).join(' · ');
  let d = g.dados || [], corpo = '', rod = '';
  if (pl) {
    const k = plChave(g);
    if (mcpPronto && mcp && !PL[k]) lerPlanilha(g);
    const st = PL[k] || {};
    d = st.dados || [];
    if (mcpPronto && !mcp) corpo = `<span class="sub">Este gráfico lê uma planilha do Google Sheets. Abra a central no claude.ai, com o conector Google Sheets ativo, para ver os dados.</span>`;
    else if (st.erro) corpo = `<span class="sub">${esc(st.erro)}</span>`;
    else if (!d.length) corpo = `<span class="sub">Lendo a planilha…</span>`;
    rod = `<div class="meta sub" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${plId(g.planilhaUrl) ? `<a href="https://docs.google.com/spreadsheets/d/${esc(plId(g.planilhaUrl))}" target="_blank" rel="noopener">Abrir planilha</a>` : ''}<span>${esc(g.intervalo || '')}</span>${st.em ? `<span>lido às ${new Date(st.em).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>` : ''}${mcp ? `<button class="btn mini" data-act="ler-planilha" data-id="${g.id}" ${st.lendo ? 'disabled' : ''}>${st.lendo ? 'Lendo…' : 'Atualizar'}</button>` : ''}</div>`;
  } else if (!d.length) corpo = '<span class="sub">Sem dados.</span>';
  return `<div class="card chart"><div class="head"><div><h3>${esc(g.titulo)}</h3>${det ? `<span class="sub">${esc(det)}</span>` : ''}</div>${btn('edit-grafico', 'Editar', `data-id="${g.id}"`, 'mini')}</div>${corpo || (g.tipo === 'linha' ? linha(d, g.unidade) : barras(d, g.unidade))}${rod}${g.nota ? `<p class="sub doc">${esc(g.nota)}</p>` : ''}</div>`;
}

/* ---------- render e rotas ---------- */
const ROT = { inicio: vInicio, clientes: vClientes, sprint: vSprint, insights: vInsights, documentacao: vDocs };
const rota = () => location.hash.slice(1) || 'inicio';
let raf = 0;
function render() { cancelAnimationFrame(raf); raf = requestAnimationFrame(draw); }
function draw() {
  $('#nav').hidden = !!bloqueio;
  if (bloqueio) { $('#chatview').hidden = true; $('#main').hidden = false; $('#main').innerHTML = bloqueio; return; }
  const r = rota(), aba = r.startsWith('c-') ? 'clientes' : r.startsWith('d-') ? 'documentacao' : (ROT[r] || r === 'chat' ? r : 'inicio');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + aba));
  $('#main').hidden = r === 'chat'; $('#chatview').hidden = r !== 'chat';
  if (r === 'chat') renderChat();
  else $('#main').innerHTML = r.startsWith('c-') ? vCliente(r.slice(2)) : r.startsWith('d-') ? vDoc(r.slice(2)) : (ROT[r] || vInicio)();
  perfis();
}
function perfis() {
  if (!user || pedindoPerfis) return;
  const ids = new Set();
  S.insights.forEach(i => i.autorId && ids.add(i.autorId)); S.tarefas.forEach(t => { t.responsavelId && ids.add(t.responsavelId); t.criadoPor && ids.add(t.criadoPor); }); S.chat.forEach(m => m.autorId && ids.add(m.autorId));
  S.membros.forEach(m => ids.add(m.id)); S.sprint?.liderId && ids.add(S.sprint.liderId); me.id && ids.add(me.id); ids.delete('todos');
  const falta = [...ids].filter(i => !(i in P));
  if (!falta.length) return;
  pedindoPerfis = true;
  user.profiles(falta).then(ps => { falta.forEach(i => P[i] = ps[i] || { name: '' }); pedindoPerfis = false; render(); });
}

/* ---------- formulário genérico ---------- */
let formCfg = null;
function openForm(cfg) {
  formCfg = cfg; const v = cfg.valores || {};
  $('#frm').innerHTML = `<h2>${esc(cfg.titulo)}</h2>` + cfg.campos.map(c => {
    const val = v[c.k] ?? c.padrao ?? '', id = 'f-' + c.k;
    let ctl;
    if (c.tipo === 'sel') ctl = `<select id="${id}">${c.ops.map(([k, l]) => `<option value="${esc(k)}" ${String(val) === String(k) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
    else if (c.tipo === 'area') ctl = `<textarea id="${id}" ${c.alto ? 'style="min-height:280px"' : ''}>${esc(val)}</textarea>`;
    else ctl = `<input id="${id}" type="${c.tipo === 'date' ? 'date' : 'text'}" ${c.tipo === 'num' ? 'inputmode="decimal"' : ''} value="${esc(c.tipo === 'num' && val !== '' ? String(val).replace('.', ',') : val)}" ${c.lista ? `list="${id}-l"` : ''}>` + (c.lista ? `<datalist id="${id}-l">${c.lista.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '');
    return `<label for="${id}" data-k="${c.k}"><span>${esc(c.label)}${c.req ? ' *' : ''}</span>${ctl}${c.dica ? `<small>${esc(c.dica)}</small>` : ''}</label>`;
  }).join('') + `<div id="ferr" role="alert"></div><div class="actions"><button class="btn pri" type="submit">Salvar</button><button class="btn" type="button" id="fcancel">Cancelar</button><span class="sp"></span>${cfg.excluir ? `<button class="btn danger" type="button" id="fdel">Excluir</button>` : ''}</div>`;
  visForm();
  $('#dlg').showModal();
}
/* Campos com `se` só aparecem quando a condição vale para os valores atuais do formulário (ex.: macroetapa só no CSAT). */
const formVals = () => Object.fromEntries(formCfg.campos.map(c => [c.k, $('#f-' + c.k).value.trim()]));
function visForm() {
  const cur = formVals();
  formCfg.campos.forEach(c => { if (c.se) $('#f-' + c.k).closest('label').hidden = !c.se(cur); });
}
$('#frm').addEventListener('change', () => formCfg && visForm());
$('#frm').addEventListener('click', async e => {
  if (e.target.id === 'fcancel') $('#dlg').close();
  if (e.target.id === 'fdel') {
    if (e.target.dataset.ok) { try { await formCfg.excluir(); $('#dlg').close(); } catch { $('#ferr').textContent = 'Não foi possível excluir. Tente de novo.'; } }
    else { e.target.dataset.ok = 1; e.target.textContent = 'Confirmar exclusão'; }
  }
});
$('#frm').addEventListener('submit', async e => {
  e.preventDefault();
  const vals = {}, err = $('#ferr'), cur = formVals();
  for (const c of formCfg.campos) {
    if (c.se && !c.se(cur)) continue;
    let x = $('#f-' + c.k).value.trim();
    if (c.req && !x) { err.textContent = `Preencha o campo “${c.label}”.`; return; }
    if (c.tipo === 'num' && x) { x = parseFloat(x.replace(/\./g, '').replace(',', '.')); if (!isFinite(x)) { err.textContent = `“${c.label}” precisa ser um número, por exemplo 42 ou 7,5.`; return; } }
    if (c.tipo === 'url' && x && !/^https?:\/\//i.test(x)) x = 'https://' + x;
    vals[c.k] = x;
  }
  try { const r = await formCfg.salvar(vals); if (typeof r === 'string') { err.textContent = r; return; } $('#dlg').close(); }
  catch { err.textContent = WEB ? 'Não foi possível salvar. Verifique a conexão e se a sua conta tem permissão para isso.' : 'Não foi possível salvar. Verifique se você tem permissão de contribuidor e tente de novo.'; }
});

function fInd(i, cli) {

function fGrafico(g) {

    { k: 'fonte', label: 'De onde vêm os dados', tipo: 'sel', ops: [['planilha', 'Planilha do Google Sheets'], ['manual', 'Digitar os dados aqui']], padrao: 'planilha' },

    { k: 'dados', label: 'Dados', tipo: 'area', se: v => !ePl(v), req: 1, dica: 'Uma linha por ponto, no formato “Rótulo; valor”. Ex.: Janeiro; 42.' },
    { k: 'unidade', label: 'Unidade', dica: 'Ex.: leads, %, R$. Pode ficar em branco.' },
    { k: 'clienteId', label: 'Cliente relacionado', tipo: 'sel', ops: cliOps() },

    salvar: v => {

        if (!plId(v.planilhaUrl)) return 'Não reconheci o link. Cole o endereço completo da planilha, que começa com docs.google.com/spreadsheets.';
      } else {
        for (const ln of v.dados.split('\n').map(s => s.trim()).filter(Boolean)) {
          const k = Math.max(ln.lastIndexOf(';'), ln.lastIndexOf('\t')), r = k > 0 ? ln.slice(0, k).trim() : '', n = numero(ln.slice(k + 1));
          if (!r || !isFinite(n)) return `Não entendi a linha “${ln}”. Use o formato “Rótulo; valor”, por exemplo “Janeiro; 42”.`;
          dados.push({ r, v: n });
        }
        if (dados.length > 40) return 'Use no máximo 40 pontos por gráfico.';

      return put('graficos', g?.id || newId(), { ...(g ? semId(g) : { autorId: me.id || '', criadoEm: Date.now() }), titulo: v.titulo, tipo: v.tipo, fonte: v.fonte, planilhaUrl: v.planilhaUrl || '', intervalo: v.intervalo || '', unidade: v.unidade, clienteId: v.clienteId, nota: v.nota, dados });
    },
    excluir: g && (() => del('graficos', g.id)) });
}

/* ---------- modo site (fora do claude.ai) ----------
   A mesma página roda em dois lugares. Dentro do claude.ai ela usa o banco, o login e o conector do Claude.
   Aberta como site comum (GitHub Pages), usa o Firebase: login com Google, banco Firestore com a mesma estrutura
   de coleções, e as planilhas são lidas pelo link público do Google Sheets. */
/* Configuração do projeto Firebase (Configurações do projeto → Seus apps → Configuração do SDK). Não é segredo:
   quem protege os dados são as regras do Firestore. */
const FIREBASE = {
  apiKey: 'AIzaSyBFqGRCMUGGzm62bWlvuSeY2EY8z_q6XtI',
  authDomain: 'central-cx-ayra.firebaseapp.com',
  projectId: 'central-cx-ayra',
  storageBucket: 'central-cx-ayra.firebasestorage.app',
  messagingSenderId: '925179329861',
  appId: '1:925179329861:web:37540f906a4a37f681d22c',
};
const FB_VER = '10.12.5';
let WEB = false, auth = null, bloqueio = '';
const cartao = (t, p, extra = '') => `<section class="card sec" style="max-width:460px;margin:40px auto;text-align:center;align-items:center"><h1>${t}</h1><p class="sub">${p}</p>${extra}</section>`;
const carrega = src => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
/* Lê um intervalo de uma planilha compartilhada por link, sem conector: o Google devolve os dados chamando a função `cb`. */
function lerGviz(id, intervalo) {
  return new Promise((ok, no) => {
    const cb = 'gviz' + newId(), s = document.createElement('script'), k = intervalo.lastIndexOf('!');
    const aba = k > 0 ? intervalo.slice(0, k).replace(/^'|'$/g, '') : '', faixa = k > 0 ? intervalo.slice(k + 1) : intervalo;
    const fim = (f, x) => { clearTimeout(t); delete window[cb]; s.remove(); f(x); };
    const t = setTimeout(() => fim(no, { code: 'gviz' }), 15000);
    window[cb] = r => r?.status === 'ok' ? fim(ok, { payload: { values: (r.table?.rows || []).map(l => (l.c || []).map(c => !c ? '' : typeof c.v === 'number' ? c.v : (c.f ?? c.v ?? ''))) } }) : fim(no, { code: 'gviz' });
    s.onerror = () => fim(no, { code: 'gviz' });
    s.src = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=0${aba ? '&sheet=' + encodeURIComponent(aba) : ''}&range=${encodeURIComponent(faixa)}`;
    document.head.appendChild(s);
  });
}
async function startWeb() {
  WEB = true;
  if (!FIREBASE) { bloqueio = cartao('Configuração pendente', 'O site ainda não foi ligado ao banco de dados. Falta informar a configuração do Firebase no código.'); render(); return; }
  bloqueio = cartao('Central CX', 'Carregando…'); render();
  try { for (const m of ['app', 'auth', 'firestore']) await carrega(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`); }
  catch { bloqueio = cartao('Sem conexão', 'Não foi possível carregar o site. Verifique a internet e recarregue a página.'); render(); return; }
  firebase.initializeApp(FIREBASE); auth = firebase.auth();
  auth.onAuthStateChanged(u => {
    if (!u) {
      if (db) { location.reload(); return; }
      bloqueio = cartao('Central CX · Ayra', 'Entre com a sua conta Google para acessar a central da equipe.', `<button class="btn pri" data-web="entrar">Entrar com Google</button><div id="werr" class="sub" role="alert"></div>`); render(); return;
    }
    me = { id: u.uid, nome: u.displayName || u.email || '', email: (u.email || '').toLowerCase() };
    db = firebase.firestore(); bloqueio = '';
    mcp = { callTool: (_s, _t, inp) => lerGviz(inp.spreadsheetId, inp.range) }; mcpPronto = true;
    $('#sair').hidden = false; $('#acessos').hidden = false;
    ligar();
  });
}
document.addEventListener('click', e => {
  const w = e.target.closest('[data-web]')?.dataset.web; if (!w || !auth) return;
  if (w === 'sair') auth.signOut();
  if (w === 'entrar') auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err => {
    const el = $('#werr'); if (!el) return;
    el.textContent = err?.code === 'auth/unauthorized-domain' ? 'Este endereço ainda não foi autorizado no Firebase (Authentication → Settings → Authorized domains).'
      : ['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(err?.code) ? '' : 'Não foi possível entrar. Tente de novo.';
  });
});
/* Lista de e-mails liberados (só no modo site). As regras do Firestore só deixam o responsável pela central gravar aqui. */
function fAcessos() {
  openForm({ titulo: 'Quem pode acessar', valores: { emails: S.permitidos.map(p => p.id).sort().join('\n') }, campos: [
    { k: 'emails', label: 'E-mails liberados', tipo: 'area', dica: 'Um e-mail de conta Google por linha. Só o responsável pela central consegue alterar esta lista, e a conta dele entra sempre.' }],
    salvar: async v => {
      const novos = [...new Set(v.emails.split(/[\s,;]+/).map(e => e.trim().toLowerCase()).filter(Boolean))];
      const ruim = novos.find(e => !/^[^@\s\/]+@[^@\s\/]+\.[^@\s\/]+$/.test(e));
      if (ruim) return `“${ruim}” não parece um e-mail.`;
      const antigos = S.permitidos.map(p => p.id);
      for (const e of novos.filter(e => !antigos.includes(e))) await put('permitidos', e, { desde: Date.now() });
      for (const e of antigos.filter(e => !novos.includes(e))) await del('permitidos', e);
    } });
}
$('#acessos').addEventListener('click', () => db && fAcessos());

async function start() {
  render();
  if (!window.claude?.use) return startWeb();
  [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  window.claude.use('mcp').then(m => { mcp = m; mcpPronto = true; render(); });
  if (user) { me = await user.me(); if ((await user.can('data.write')) === false) document.body.classList.add('ro'); }
  if (!db) { document.body.classList.add('ro'); aviso('Não foi possível conectar aos dados compartilhados. Abra esta página logado no claude.ai.'); return; }
  ligar();
}
/* Assina as coleções do banco. Vale para os dois modos: o Firestore e o banco do Claude têm a mesma interface. */
function ligar() {
  const timer = setTimeout(() => aviso('Os dados ainda não responderam. O que aparece pode estar desatualizado.'), 10000);
  const ok = s => { if (!s.metadata.fromCache) { clearTimeout(timer); aviso(''); } };
  const erro = e => {
    clearTimeout(timer);
    if (WEB && e?.code === 'permission-denied') { aviso(''); bloqueio = cartao('Sem acesso', `A conta ${esc(me.email)} ainda não foi liberada para a central. Peça a liberação ao responsável e entre de novo.`, `<button class="btn" data-web="sair">Sair e trocar de conta</button>`); render(); return; }
    aviso('A conexão com os dados foi interrompida. Recarregue a página para tentar de novo.');
  };
  const lista = s => s.docs.map(x => ({ id: x.id, ...x.data() }));
  let entrei = false;
  COLS.forEach(c => db.collection(c).onSnapshot(s => {
    S[c] = lista(s); loaded[c] = true;
    if (c === 'indicadores') S[c].forEach(i => { if (ESCALA[i.tipo]) i.unidade = ''; });
    /* No modo site os nomes vêm do cadastro de membros, gravado no primeiro acesso de cada pessoa. */
    if (c === 'membros' && WEB) S[c].forEach(m => { P[m.id] = { name: m.nome || '' }; });
    ok(s); render();
    /* Registra quem abriu a central na lista da equipe, uma vez, para poder receber tarefas. */
    if (c === 'membros' && !entrei && me.id && !s.metadata.fromCache && !document.body.classList.contains('ro')) {
      entrei = true;
      const eu = byId('membros', me.id);
      if (WEB ? (!eu || eu.nome !== me.nome) : !eu) put('membros', me.id, WEB ? { desde: eu?.desde || Date.now(), nome: me.nome } : { desde: Date.now() }).catch(() => {});
    }
  }, erro));
  db.doc('config/sprint').onSnapshot(s => { S.sprint = s.exists ? s.data() : null; render(); }, erro);
  db.collection('chat').orderBy('ts', 'desc').limit(200).onSnapshot(s => { S.chat = lista(s); loaded.chat = true; render(); }, erro);
  if (WEB) db.collection('permitidos').onSnapshot(s => { S.permitidos = lista(s); }, () => {});
}
start();
